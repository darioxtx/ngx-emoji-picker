name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build library
        run: npm run build

      #- name: Run unit tests
      #  run: npm run test:ci

      #- name: Build
      #  run: npm run build

      #- name: coverage
      #  uses: codecov/codecov-action@v3
      #  with:
      #    token: ${{ secrets.CODECOV_TOKEN }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build-prod
      - name: Create release archives
        run: |
          mkdir -p release-artifacts
          cd dist
          zip -r ../release-artifacts/ngx-emoji-picker.zip ngx-emoji-picker
          tar -czf ../release-artifacts/ngx-emoji-picker.tar.gz ngx-emoji-picker
      - name: Configure semantic-release for GitHub only
        run: |
          cat <<'EOF' > .releaserc.json
          {
            "branches": ["master"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              [
                "@semantic-release/github",
                {
                  "assets": [
                    {
                      "path": "release-artifacts/ngx-emoji-picker.zip",
                      "label": "Package build (.zip)"
                    },
                    {
                      "path": "release-artifacts/ngx-emoji-picker.tar.gz",
                      "label": "Package build (.tar.gz)"
                    }
                  ]
                }
              ]
            ]
          }
          EOF
      - name: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
